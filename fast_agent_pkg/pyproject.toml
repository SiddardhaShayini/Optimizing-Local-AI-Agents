[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-agent"
version = "0.1.0"
description = "Hardware-adaptive, zero-overhead local LLM agent framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fast_agent*"]