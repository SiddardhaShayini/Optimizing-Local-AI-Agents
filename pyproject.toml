[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-agent"
version = "0.2.0"
description = "Hardware-adaptive, zero-overhead local LLM inference orchestrator for edge devices"
readme = "README.md"
authors = [{ name = "Siddardha Shayini" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
wizard = ["streamlit>=1.20.0"]
tools = ["duckduckgo-search>=6.0.0"]
dev = ["pytest>=7.0.0"]
all = ["streamlit>=1.20.0", "duckduckgo-search>=6.0.0", "pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["fast_agent_pkg"]
include = ["fast_agent*"]
